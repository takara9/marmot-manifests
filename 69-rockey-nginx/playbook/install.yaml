- name: setup servers
  hosts: all
  become: true
  gather_facts: yes
  vars_files:
    - vars/cert.yaml
  vars:
    nginx_service_state: started
    nginx_service_enabled: true
    nginx_doc_root: /usr/share/nginx/html
  tasks:
  roles:
    - web-nginx
  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded