apiVersion: v1
kind: Server
metadata:
    name: web4
    comment: marmotホストが繋がるネットワークに接続する仮想サーバー
    labels:
        unit: 22
        role: rocky
spec:
    cpu: 1
    memory: 1024
    mmImage: rocky9
    auth:
        url: https://github.com/takara9.keys
        users:
         - ubuntu
         - rocky
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
