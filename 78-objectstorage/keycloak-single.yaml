apiVersion: v1
kind: Server
metadata:
    name: garage
    comment: GARAGEサーバー
    labels:
        app: garage
spec:
    cpu: 2
    memory: 4096
    mmImage: ubuntu24.04
    auth:
        url: https://github.com/takara9.keys
        users:
          - ubuntu
          - keycloak
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
          address: 192.168.1.198    # 内部DNSに登録済のIPアドレス garage.labo.local
          nameservers:              
            addresses:
                - 192.168.1.9       # 内部DNSのアドレス
            search:                 # ドメイン名を省略可能なドメインをセット
                - labo.local
          netmasklen: 24            # ネットマスク
          routes:                   # デフォルトGW ルーターのアドレスを指定
            - to: default
              via: 192.168.1.1
