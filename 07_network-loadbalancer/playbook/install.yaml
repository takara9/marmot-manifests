- name: setup servers
  hosts: all
  become: true
  gather_facts: yes
  vars:
    - debug: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  roles:
    - webapl

  handlers:
    - name: Reload systemd and restart myserver
      systemd:
        daemon_reload: yes
        name: "webapl.service"
        state: restarted
