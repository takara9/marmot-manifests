apiVersion: v1
kind: Server
metadata:
    name: web07-1
    comment: プライベートネットワークに接続するサーバー
    labels:
        app: web
spec:
    cpu: 1
    memory: 1024
    mmImage: webserver2
    auth:
        publicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP6CPvNHHeF8rHScC7vrq7HMqTPQJcl08atMSqHk/gSy For marmot VMs"
        users:
         - ubuntu
    networkInterface:
        - networkname: nlb-net
