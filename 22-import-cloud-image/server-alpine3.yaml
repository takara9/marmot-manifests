apiVersion: v1
kind: Server
metadata:
    name: srv-alpine3
    comment: marmotホストが繋がるネットワークに接続する仮想サーバー
    labels:
        unit: 22
        role: alpine
spec:
    cpu: 1
    memory: 1024
    mmImage: alpine3
    auth:
        publicKey: "ssh-rsa  ubuntu@hv0"
    networkInterface:
        - networkname: host-bridge
