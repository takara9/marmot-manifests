mysql_data_device: /dev/vdb
mysql_data_mount_point: /var/lib/mysql
mysql_data_fstype: ext4
mysql_data_force_format: false

mysql_package_name: mysql-server
mysql_service_name: mysql
mysql_major_version: "8.0"
mysql_exporter_package_name: prometheus-mysqld-exporter
mysql_exporter_service_name: prometheus-mysqld-exporter
mysql_exporter_enabled: true
mysql_exporter_user: mysqld_exporter
mysql_exporter_password: "{{ lookup('env', 'MYSQL_EXPORTER_PASSWORD') | default('', true) }}"
mysql_exporter_allowed_host: localhost
mysql_exporter_cnf_path: /etc/prometheus/mysqld_exporter.cnf
mysql_exporter_args: "--config.my-cnf={{ mysql_exporter_cnf_path }}"

mysql_bind_address: 0.0.0.0
mysql_remote_allowed_hosts:
  - 192.168.1.%
  - 10.1.%.%
  - 172.16.%.%
  - localhost

mysql_remote_admin_user: mysqladmin
mysql_remote_admin_password: "{{ lookup('env', 'MYSQL_REMOTE_ADMIN_PASSWORD') | default('', true) }}"

mysql_bom_tools_dir: /opt/bom-tools
mysql_bom_tools_scripts:
  - generate_bom_mock_data.py
  - stress_bomdb_transactions.py
mysql_bom_tools_venv_dir: "{{ mysql_bom_tools_dir }}/.venv"
mysql_bom_tools_python_packages:
  - mysql-connector-python
