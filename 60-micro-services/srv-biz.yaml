apiVersion: v1
kind: Server
metadata:
    name: biz-server
    comment: プロダクト選択BOM取得の模擬アプリ
spec:
    cpu: 1
    memory: 2048
    mmImage: ubuntu24.04
    auth:
        url: https://github.com/takara9.keys
    ansible:
        playbook: playbook/biz-server-setup.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
        - networkname: biz-net
        - networkname: rest-net
