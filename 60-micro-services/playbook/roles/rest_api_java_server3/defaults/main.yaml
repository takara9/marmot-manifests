rest_api_java_service_name: rest-api-java-server3
rest_api_java_service_user: restapi3
rest_api_java_service_group: restapi3
rest_api_java_app_dir: /opt/rest-api-java-server3
rest_api_java_listen_host: 0.0.0.0
rest_api_java_listen_port: 5000
rest_api_java_log_level: INFO
rest_api_response_delay_seconds: "{{ lookup('env', 'REST_API_RESPONSE_DELAY_SECONDS') | default('0', true) }}"