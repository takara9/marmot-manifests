apiVersion: v1
kind: Server
metadata:
    name: web-org
    comment: プライベートネットワークに接続するサーバー
    labels:
        app: web3
spec:
    cpu: 1
    memory: 1024
    mmImage: ubuntu24.04
    auth:
        publicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP6CPvNHHeF8rHScC7vrq7HMqTPQJcl08atMSqHk/gSy For marmot VMs"
        users:
         - ubuntu
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/host-org.yaml
    networkInterface:
        - networkname: host-bridge
        - networkname: app-net
