apiVersion: v1
kind: Server
metadata:
    name: minikube
    comment: Minikube
spec:
    cpu: 2
    memory: 6144
    mmImage: ubuntu24.04
    bootVolume:
        spec:
            size: 30
            type: qcow2
    auth:
        url: https://github.com/takara9.keys
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
