apiVersion: v1
kind: Server
metadata:
    name: server-70
    comment: Ansibleプレイブックを自動実行するサーバー
spec:
    cpu: 1
    memory: 1024
    mmImage: ubuntu24.04
    auth:
        url: https://github.com/takara9.keys
    ansible:
        onBoot: true
        pull: 
          url: "https://github.com/takara9/marmot-ansible"
          playbook_yaml: "01-check-install/playbook/setup.yaml"
    networkInterface:
        - networkname: default
