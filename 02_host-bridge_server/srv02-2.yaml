apiVersion: v1
kind: Server
metadata:
    name: srv02-2
    comment: ホスト・ブリッジ接続の仮想サーバー、IPアドレス自動割り当て RSA公開鍵利用
spec:
    cpu: 1
    memory: 1024
    mmImage: ubuntu24.04
    auth:
        publicKey: "ssh-rsa  ubuntu@hv0"
        #users:
        # - ubuntu
    networkInterface:
        - networkname: host-bridge
