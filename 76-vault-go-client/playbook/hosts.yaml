all:
  children:
    vault_client:
      hosts:
        vault-client:
      vars:
        ansible_connection: ssh
        ansible_ssh_executable: /usr/local/bin/mactl-ssh
        ansible_user: ubuntu
        ansible_python_interpreter: /usr/bin/python3
    # CA 証明書の取得元 (75-vault-cluster の先頭ノード)
    vault_ca_sources:
      hosts:
        vault-cluster-1:
          ansible_host: 192.168.1.194
      vars:
        ansible_connection: ssh
        ansible_user: ubuntu
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
