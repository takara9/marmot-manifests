# テストコード (../gotest) をクライアントに配置し、依存モジュールを取得してビルドを確認する。
# src の末尾が / のため、cmd/ などのサブディレクトリも含めて再帰的にコピーされる。
# certs/ と bin/ は除外する (CA 証明書は vaultcli ロールが /etc/vault-client に配置する)
- name: Create test code directory
  ansible.builtin.file:
    path: "{{ gotest_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Copy test code
  ansible.builtin.copy:
    src: "{{ gotest_src }}/"
    dest: "{{ gotest_dir }}/"
    mode: preserve
  become: false

- name: Remove local-only directories copied from the control node
  ansible.builtin.file:
    path: "{{ gotest_dir }}/{{ item }}"
    state: absent
  loop:
    - certs
    - bin
  become: false

- name: Download Go modules
  ansible.builtin.command: "{{ gotest_go }} mod download"
  args:
    chdir: "{{ gotest_dir }}"
  environment:
    GOPATH: "/home/{{ gotest_user }}/go"
  changed_when: false
  become: false

- name: Vet test code
  ansible.builtin.command: "{{ gotest_go }} vet ./..."
  args:
    chdir: "{{ gotest_dir }}"
  environment:
    GOPATH: "/home/{{ gotest_user }}/go"
  changed_when: false
  become: false

- name: Build kvdemo
  ansible.builtin.command: "{{ gotest_go }} build -o bin/kvdemo ./cmd/kvdemo"
  args:
    chdir: "{{ gotest_dir }}"
  environment:
    GOPATH: "/home/{{ gotest_user }}/go"
  changed_when: false
  become: false
