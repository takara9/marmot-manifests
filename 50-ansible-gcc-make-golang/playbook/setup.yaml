- name: Setup the guest OS
  gather_facts: yes
  vars:
    go_version: "1.26.2"
  hosts: all
  become: yes
  roles:
  tasks:
  - debug: msg="{{ ansible_facts }}"
  - name: パッケージのインストール
    apt:
      name: "{{ packages }}"
      state: present
    vars:
      packages:
        - gcc
        - make

  - name: 既存の Go を削除
    file:
      path: /usr/local/go
      state: absent

  - name: Go アーカイブをダウンロード
    get_url:
      url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch_map.get(ansible_architecture, ansible_architecture) }}.tar.gz"
      dest: "/tmp/go{{ go_version }}.linux-{{ go_arch_map.get(ansible_architecture, ansible_architecture) }}.tar.gz"
      mode: "0644"
    vars:
      go_arch_map:
        x86_64: amd64
        amd64: amd64
        aarch64: arm64
        arm64: arm64

  - name: Go アーカイブを展開
    unarchive:
      src: "/tmp/go{{ go_version }}.linux-{{ go_arch_map.get(ansible_architecture, ansible_architecture) }}.tar.gz"
      dest: /usr/local
      remote_src: yes
    vars:
      go_arch_map:
        x86_64: amd64
        amd64: amd64
        aarch64: arm64
        arm64: arm64

  - name: Go の PATH を設定
    copy:
      dest: /etc/profile.d/go.sh
      mode: "0644"
      content: |
        export PATH=$PATH:/usr/local/go/bin
