apiVersion: v1
kind: Server
metadata:
    name: server-41-b
    comment: Ansibleプレイブックを自動実行するサーバー
spec:
    cpu: 1
    memory: 1024
    mmImage: ubuntu24.04
    auth:
        url: https://github.com/takara9.keys
    ansible:
        onBoot: true
        pull: 
          url: "https://github.com/takara9/marmot-ansible"
          playbook_yaml: "01-gcc-make-golang/playbook/setup.yaml"
    networkInterface:
        - networkname: default
