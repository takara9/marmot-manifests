- name: Create prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true

- name: Create prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ prometheus_config_dir }}", owner: root, group: "{{ prometheus_group }}", mode: "0755" }
    - { path: "{{ prometheus_data_dir }}", owner: "{{ prometheus_user }}", group: "{{ prometheus_group }}", mode: "0755" }

- name: Download prometheus release archive
  ansible.builtin.get_url:
    url: "{{ prometheus_download_base_url }}/{{ prometheus_archive_name }}.tar.gz"
    dest: "/tmp/{{ prometheus_archive_name }}.tar.gz"
    checksum: "sha256:{{ prometheus_download_base_url }}/sha256sums.txt"
    mode: "0644"

- name: Extract prometheus release archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ prometheus_archive_name }}.tar.gz"
    dest: /opt
    remote_src: true
    owner: root
    group: root
    creates: "{{ prometheus_install_dir }}/prometheus"
  notify: Restart prometheus

- name: Link prometheus binaries
  ansible.builtin.file:
    src: "{{ prometheus_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop:
    - prometheus
    - promtool
  notify: Restart prometheus

- name: Install prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0644"
    validate: /usr/local/bin/promtool check config %s
  notify: Restart prometheus

- name: Install prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: "/etc/systemd/system/{{ prometheus_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart prometheus

- name: Flush handlers before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start prometheus service
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    enabled: true
    state: started

- name: Wait until prometheus is ready
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_port }}/-/ready"
    status_code: 200
  register: prometheus_ready
  retries: 12
  delay: 5
  until: prometheus_ready.status == 200
