- name: Install loki package
  ansible.builtin.apt:
    name: "{{ loki_package_name }}"
    state: "{{ loki_package_state }}"
    update_cache: true
    cache_valid_time: 3600

- name: Look up loki service account
  ansible.builtin.getent:
    database: passwd
    key: "{{ loki_user }}"

- name: Create loki data directory
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ ansible_facts.getent_passwd[loki_user][2] }}"
    mode: "0750"

- name: Install loki configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ loki_config_path }}"
    owner: root
    group: "{{ ansible_facts.getent_passwd[loki_user][2] }}"
    mode: "0640"
  notify: Restart loki

- name: Flush handlers before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start loki service
  ansible.builtin.systemd:
    name: "{{ loki_service_name }}"
    enabled: true
    state: started

- name: Wait until loki is ready
  ansible.builtin.uri:
    url: "http://localhost:{{ loki_http_port }}/ready"
    status_code: 200
  register: loki_ready
  retries: 18
  delay: 5
  until: loki_ready.status == 200
