all:
  vars:
    # debian-tentacle only ships bookworm/jammy dists; safe to opt in here since this host is jammy.
    ceph_release: "debian-tentacle"
    ceph_repo_distribution: "jammy"
  hosts:
    ceph-client1:
      ansible_host: ceph-client1
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_executable: /usr/local/bin/mactl-ssh
