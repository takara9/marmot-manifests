- name: Install prereqs
  ansible.builtin.apt:
    name:
      - chrony
      - lvm2
      - curl
      - gnupg
      - lsb-release
      - ca-certificates
    state: present
    update_cache: true

- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Ensure keyring dir exists
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d
    state: directory
    mode: "0755"

- name: Add Ceph repo key
  ansible.builtin.get_url:
    url: https://download.ceph.com/keys/release.asc
    dest: /etc/apt/trusted.gpg.d/ceph.asc
    mode: "0644"

- name: Add Ceph apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.list
    mode: "0644"
    content: |
      deb https://download.ceph.com/{{ ceph_release }}/ {{ ceph_repo_distribution | default(ansible_distribution_release) }} main

- name: Install cephadm and ceph-common
  ansible.builtin.apt:
    name:
      - cephadm
      - ceph-common
    state: present
    update_cache: true

- name: Ensure ceph config dir exists
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    mode: "0755"

- name: Check if Ceph already bootstrapped
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: ceph_conf_stat

- name: Resolve Ceph monitor IP from interface when undefined
  ansible.builtin.command:
    cmd: ip -o -4 addr show dev {{ ceph_mon_iface | default(ansible_default_ipv4.interface) }} scope global
  register: ceph_mon_ip_lookup_role
  changed_when: false
  when: ceph_mon_ip is not defined

- name: Fail when monitor interface has no IPv4 address
  ansible.builtin.fail:
    msg: "Interface {{ ceph_mon_iface | default(ansible_default_ipv4.interface) }} has no IPv4 address"
  when:
    - ceph_mon_ip is not defined
    - ceph_mon_ip_lookup_role.stdout_lines | length == 0

- name: Set Ceph monitor IP for bootstrap
  ansible.builtin.set_fact:
    ceph_mon_ip: "{{ ceph_mon_ip_lookup_role.stdout_lines[0].split()[3].split('/')[0] }}"
  when:
    - ceph_mon_ip is not defined
    - ceph_mon_ip_lookup_role.stdout_lines | length > 0

- name: Bootstrap Ceph (first time only)
  ansible.builtin.command:
    cmd: cephadm bootstrap --mon-ip {{ ceph_mon_ip }}
  register: ceph_bootstrap_result
  when: not ceph_conf_stat.stat.exists

- name: Show cephadm bootstrap response
  ansible.builtin.debug:
    msg:
      - "cephadm bootstrap rc={{ ceph_bootstrap_result.rc | default('N/A') }}"
      - "stdout_lines: {{ ceph_bootstrap_result.stdout_lines | default([]) }}"
      - "stderr_lines: {{ ceph_bootstrap_result.stderr_lines | default([]) }}"
  when: not ceph_conf_stat.stat.exists

- name: Save cephadm bootstrap stdout_lines to file
  ansible.builtin.copy:
    dest: /etc/ceph/cephadm-bootstrap-stdout.log
    content: "{{ (ceph_bootstrap_result.stdout_lines | default([])) | join('\n') }}\n"
    mode: "0600"
  when: not ceph_conf_stat.stat.exists

- name: Extract dashboard password line
  ansible.builtin.set_fact:
    ceph_dashboard_password_line: "{{ ceph_bootstrap_result.stdout_lines | default([]) | select('search', 'Password:') | list }}"
  when: not ceph_conf_stat.stat.exists

- name: Show dashboard password
  ansible.builtin.debug:
    msg: "{{ ceph_dashboard_password_line }}"
  when: not ceph_conf_stat.stat.exists

- name: Wait for ceph command readiness
  ansible.builtin.command:
    cmd: ceph -s
  register: ceph_status_wait
  retries: 20
  delay: 15
  until: ceph_status_wait.rc == 0
  changed_when: false

- name: List orchestrator devices (info)
  ansible.builtin.command:
    cmd: ceph orch device ls
  register: ceph_devices
  changed_when: false

- name: Add OSD daemons
  ansible.builtin.command:
    cmd: ceph orch daemon add osd {{ ansible_hostname }}:{{ item }}
  loop: "{{ ceph_osd_devices }}"
  register: osd_add_result
  changed_when: "'Created osd' in osd_add_result.stdout or 'Scheduled' in osd_add_result.stdout"
  failed_when: false

- name: List OSD ID
  ansible.builtin.command:
    cmd: ceph osd crush class ls-osd hdd
  register: osd_id_list_result
  changed_when: false

- name: Remove existing device class from OSDs
  ansible.builtin.command:
    cmd: ceph osd crush rm-device-class {{ item }}
  loop: "{{ osd_id_list_result.stdout_lines | map('trim') | reject('equalto', '') | list }}"

- name: Set SSD device class for OSDs
  ansible.builtin.command:
    cmd: ceph osd crush set-device-class ssd {{ item }}
  loop: "{{ osd_id_list_result.stdout_lines | map('trim') | reject('equalto', '') | list }}"

- name: Ensure single-node crush rule exists
  ansible.builtin.command:
    cmd: ceph osd crush rule create-replicated {{ ceph_crush_rule }} default osd
  register: crush_rule_create
  failed_when: false
  changed_when: "'created rule' in crush_rule_create.stdout.lower()"

- name: Allow pool size 1 for single-node
  ansible.builtin.command:
    cmd: ceph config set global mon_allow_pool_size_one true

- name: Disable pool no-redundancy warning for lab
  ansible.builtin.command:
    cmd: ceph config set global mon_warn_on_pool_no_redundancy false

- name: Set default pool size to 1 for lab
  ansible.builtin.command:
    cmd: ceph config set global osd_pool_default_size 1

- name: Set default pool min_size to 1 for lab
  ansible.builtin.command:
    cmd: ceph config set global osd_pool_default_min_size 1

- name: List pools
  ansible.builtin.command:
    cmd: ceph osd pool ls
  register: ceph_pool_list
  changed_when: false

- name: Set .mgr pool size to 1
  ansible.builtin.command:
    cmd: ceph osd pool set .mgr size 1 --yes-i-really-mean-it
  when: "'.mgr' in ceph_pool_list.stdout_lines"

- name: Set .mgr pool min_size to 1
  ansible.builtin.command:
    cmd: ceph osd pool set .mgr min_size 1
  when: "'.mgr' in ceph_pool_list.stdout_lines"


##############

- name: Create RBD pool
  ansible.builtin.command:
    cmd: ceph osd pool create {{ ceph_pool_name }} {{ ceph_pool_pg_num }} {{ ceph_pool_pgp_num }} {{ ceph_crush_rule }}
  register: rbd_pool_create
  failed_when: rbd_pool_create.rc != 0 and 'already exists' not in rbd_pool_create.stderr
  changed_when: "'created pool' in rbd_pool_create.stdout"

- name: Enable rbd application on RBD pool
  ansible.builtin.command:
    cmd: ceph osd pool application enable {{ ceph_pool_name }} rbd
  register: rbd_pool_app_enable
  changed_when: "'enabled application' in rbd_pool_app_enable.stdout"

- name: Initialize RBD pool
  ansible.builtin.command:
    cmd: rbd pool init {{ ceph_pool_name }}
  changed_when: false

- name: Set RBD pool size to 1 for single-node
  ansible.builtin.command:
    cmd: ceph osd pool set {{ ceph_pool_name }} size 1 --yes-i-really-mean-it

- name: Set RBD pool min_size to 1 for single-node
  ansible.builtin.command:
    cmd: ceph osd pool set {{ ceph_pool_name }} min_size 1

- name: Create RBD client user keyring
  ansible.builtin.command:
    cmd: >
      ceph auth get-or-create client.{{ ceph_rbd_user }}
      mon "profile rbd"
      osd "profile rbd pool={{ ceph_pool_name }}"
      -o /etc/ceph/ceph.client.{{ ceph_rbd_user }}.keyring
  args:
    creates: /etc/ceph/ceph.client.{{ ceph_rbd_user }}.keyring

- name: Read RBD client user key
  ansible.builtin.command:
    cmd: ceph auth print-key client.{{ ceph_rbd_user }}
  register: rbd_user_key
  changed_when: false

- name: Write RBD client user key to file
  ansible.builtin.copy:
    dest: /etc/ceph/ceph.client.{{ ceph_rbd_user }}.key
    content: "{{ rbd_user_key.stdout }}"
    mode: "0600"

- name: Apply MDS daemon for CephFS
  ansible.builtin.command:
    cmd: ceph orch apply mds {{ ceph_fs_name }} --placement="1"
  changed_when: false

- name: Create CephFS volume
  ansible.builtin.command:
    cmd: ceph fs volume create {{ ceph_fs_name }}
  register: fs_volume_create
  failed_when: false
  changed_when: "'created' in fs_volume_create.stdout.lower()"

- name: Create CephFS subvolume group for CSI
  ansible.builtin.command:
    cmd: ceph fs subvolumegroup create {{ ceph_fs_name }} {{ ceph_fs_subvolume_group }}
  register: fs_subvolumegroup_create
  failed_when: false
  changed_when: "'created' in fs_subvolumegroup_create.stdout.lower()"

- name: Create CephFS client user for CSI
  ansible.builtin.command:
    cmd: >
      ceph auth get-or-create client.{{ ceph_fs_user }}
      mgr "allow rw"
      osd "allow rwx tag cephfs metadata={{ ceph_fs_name }}, allow rw tag cephfs data={{ ceph_fs_name }}"
      mds "allow r fsname={{ ceph_fs_name }} path=/volumes, allow rws fsname={{ ceph_fs_name }} path=/volumes/{{ ceph_fs_subvolume_group }}"
      mon "allow r fsname={{ ceph_fs_name }}"
      -o /etc/ceph/ceph.client.{{ ceph_fs_user }}.keyring
  args:
    creates: /etc/ceph/ceph.client.{{ ceph_fs_user }}.keyring

- name: Read CephFS client user key
  ansible.builtin.command:
    cmd: ceph auth print-key client.{{ ceph_fs_user }}
  register: fs_user_key
  changed_when: false

- name: Write CephFS client user key to file
  ansible.builtin.copy:
    dest: /etc/ceph/ceph.client.{{ ceph_fs_user }}.key
    content: "{{ fs_user_key.stdout }}"
    mode: "0600"

##############


- name: Final status check
  ansible.builtin.command:
    cmd: ceph status
  changed_when: false

- name: Final fs status check
  ansible.builtin.command:
    cmd: ceph fs status
  changed_when: false

- name: Final mds stat check
  ansible.builtin.command:
    cmd: ceph mds stat
  changed_when: false

- name: Final health detail check
  ansible.builtin.command:
    cmd: ceph health detail
  changed_when: false
