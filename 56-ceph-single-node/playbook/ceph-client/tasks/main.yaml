- name: Install prereqs
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - lsb-release
      - ca-certificates
    state: present
    update_cache: true

- name: Ensure keyring dir exists
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d
    state: directory
    mode: "0755"
  when: ceph_release is defined

- name: Add Ceph repo key
  ansible.builtin.get_url:
    url: https://download.ceph.com/keys/release.asc
    dest: /etc/apt/trusted.gpg.d/ceph.asc
    mode: "0644"
  when: ceph_release is defined

- name: Add Ceph apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.list
    mode: "0644"
    content: |
      deb https://download.ceph.com/{{ ceph_release }}/ {{ ceph_repo_distribution | default(ansible_distribution_release) }} main
  when: ceph_release is defined

- name: Ensure ceph config dir exists
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    mode: "0755"

- name: Install ceph-common client package
  ansible.builtin.apt:
    name:
      - ceph-common
    state: present
    update_cache: true

- name: Show installed ceph client version
  ansible.builtin.command:
    cmd: ceph --version
  register: ceph_client_version
  changed_when: false

- name: Display ceph client version
  ansible.builtin.debug:
    msg: "{{ ceph_client_version.stdout }}"
