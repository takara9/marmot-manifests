apiVersion: v1
kind: Server
metadata:
    name: ceph-single
    comment: シングル最小構成のCephストレージのサーバー
spec:
    cpu: 2
    memory: 4096
    mmImage: ubuntu24.04 
    bootVolume:
        spec:
            size: 100   ## Debugログが出ているため、一時的にサイズを増やしています
            type: qcow2
    auth:
        url: https://github.com/takara9.keys
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
    storage:
        - metadata:
            name: osd1
            comment: Ceph OSD1
          spec:
            size: 100
            persistent: true
            type: lvm
        - metadata:
            name: osd2
            comment: Ceph OSD2
          spec:
            size: 100
            persistent: true
            type: lvm
        - metadata:
            name: osd3
            comment: Ceph OSD3
          spec:
            size: 100
            persistent: true
            type: lvm
