all:
  children:
    etcd_client:
      hosts:
        etcd-client:
      vars:
        ansible_connection: ssh
        ansible_ssh_executable: /usr/local/bin/mactl-ssh
        ansible_user: ubuntu
        ansible_python_interpreter: /usr/bin/python3
    # CA 証明書の取得元 (71-etcd-single と 72-etcd-cluster の先頭ノード)
    etcd_ca_sources:
      hosts:
        etcd-single:
          ansible_host: 192.168.1.190
        etcd-cluster-1:
          ansible_host: 192.168.1.191
      vars:
        ansible_connection: ssh
        ansible_user: ubuntu
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
