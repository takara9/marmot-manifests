- name: setup IIS web server on Windows Server
  hosts: all
  gather_facts: false   # SSH接続のWindowsでは setup モジュールを使わない
  vars:
    iis_site_name: Default Web Site
    iis_server_name: web3.labo.local   # 自己署名証明書のCN/SAN
    iis_web_root: C:\inetpub\wwwroot
    iis_open_firewall: true   # Windows Firewall で 80/443 を開放する場合 true
    iis_index_html: |
      <html><body><h1>{{ inventory_hostname }}.host-bridge.hv0.labo.local</h1></body></html>
  tasks:
    - name: Install IIS
      ansible.windows.win_feature:
        name: Web-Server
        state: present
        include_management_tools: true
      register: iis_feature

    - name: Reboot if required by IIS installation
      ansible.windows.win_reboot:
      when: iis_feature.reboot_required

    - name: Deploy index.html
      ansible.windows.win_copy:
        dest: "{{ iis_web_root }}\\index.html"
        content: "{{ iis_index_html }}"

    - name: Create self-signed TLS certificate
      ansible.windows.win_powershell:
        parameters:
          DnsName: "{{ iis_server_name }}"
        script: |
          param([string]$DnsName)
          $Ansible.Changed = $false
          $cert = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object { $_.Subject -eq "CN=$DnsName" -and $_.NotAfter -gt (Get-Date).AddDays(30) } |
            Sort-Object NotAfter -Descending | Select-Object -First 1
          if (-not $cert) {
            $cert = New-SelfSignedCertificate -DnsName $DnsName `
              -CertStoreLocation Cert:\LocalMachine\My -NotAfter (Get-Date).AddYears(5)
            $Ansible.Changed = $true
          }
          $Ansible.Result = $cert.Thumbprint
      register: iis_cert

    - name: Add HTTPS binding
      community.windows.win_iis_webbinding:
        name: "{{ iis_site_name }}"
        protocol: https
        port: 443
        ip: "*"
        certificate_hash: "{{ iis_cert.result }}"
        certificate_store_name: My
        state: present

    - name: Allow HTTP/HTTPS via Windows Firewall
      community.windows.win_firewall_rule:
        name: "IIS {{ item.name }}"
        localport: "{{ item.port }}"
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true
      loop:
        - { name: HTTP, port: 80 }
        - { name: HTTPS, port: 443 }
      when: iis_open_firewall | bool

    - name: Ensure W3SVC is started and enabled
      ansible.windows.win_service:
        name: W3SVC
        state: started
        start_mode: auto

    - name: Verify HTTP responds
      ansible.windows.win_uri:
        url: http://localhost/
        return_content: true
      register: iis_http_check
      retries: 3
      delay: 2
      until: iis_http_check.status_code == 200

    - name: Verify HTTPS responds
      ansible.windows.win_uri:
        url: https://localhost/
        validate_certs: false   # localhost は証明書のCN/SANと一致しないため応答確認のみ
      register: iis_https_check
      retries: 3
      delay: 2
      until: iis_https_check.status_code == 200
