# ゾーン labo.local のデータ。ns1 (CoreDNS) の /coredns/labo.db から移行した。
# レコードを変更したら install.yaml の dns_zone_serial を増やすこと。
# PTR レコードは dns_reverse_zones に該当する A レコードから自動生成する。
# 同じ IP に複数の名前がある場合は、PTR を付けない側に ptr: false を指定する。

# 並行運用するドメイン。下記のレコード(A/CNAME/MX)は全ドメインに同じ内容で作られる。
# 最終的に lab.internal を残す。移行完了の手順:
#   1. dns_ptr_domain を lab.internal に変更する
#   2. dns_domains から labo.local を削除する(旧ゾーンは named.conf.local から外れる)
#   3. dns_stub_zones を lab.internal 側のサブゾーンに置き換える
dns_domains:
  - labo.local
  - lab.internal

# 逆引き(PTR)と SOA/NS の逆引きゾーンが指すドメイン。1つだけ指定する
dns_ptr_domain: labo.local

dns_a_records:
