- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install apache2
  ansible.builtin.apt:
    name: apache2
    state: present

- name: Enable Apache modules
  ansible.builtin.command: "a2enmod {{ item }}"
  args:
    creates: "/etc/apache2/mods-enabled/{{ item }}.load"
  loop: "{{ apache_modules }}"
  notify: Restart apache2

- name: Deploy index.html
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: "{{ apache_index_html }}"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Allow HTTP/HTTPS via UFW
  community.general.ufw:
    rule: allow
    name: "Apache Full"
  when: apache_open_firewall | bool

- name: Ensure apache2 is started and enabled
  ansible.builtin.systemd_service:
    name: apache2
    state: started
    enabled: true

- name: Flush handlers before verification
  ansible.builtin.meta: flush_handlers

- name: Verify Apache responds on localhost
  ansible.builtin.uri:
    url: http://localhost/
    status_code: 200
  register: apache_check
  retries: 3
  delay: 2
  until: apache_check.status == 200