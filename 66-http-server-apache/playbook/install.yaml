- name: setup servers
  hosts: all
  become: true
  gather_facts: yes
  vars:
    apache_modules:
      - rewrite
      - headers
      - ssl
    apache_open_firewall: true   # UFW で 80/443 を開放する場合 true
    apache_server_name: web2.labo.local   # roles/web-apache/files/ に <apache_server_name>.crt/.key を置く
    apache_cert_dir: /etc/apache2/ssl
    apache_index_html: |
      <html><body><h1>{{ inventory_hostname }}.host-bridge.hv0.labo.local</h1></body></html>
  tasks:
  roles:
    - web-apache
  handlers:
    - name: Validate Apache config
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      listen: Restart apache2
    - name: Restart apache2 service
      ansible.builtin.systemd_service:
        name: apache2
        state: restarted
      listen: Restart apache2