apiVersion: v1
kind: Server
metadata:
    name: web2
    comment: Ansibleで、Webserverをインストールする
    labels:
        app: w2
spec:
    cpu: 1
    memory: 1024
    mmImage: ubuntu24.04
    auth:
        url: https://github.com/takara9.keys
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
          address: 192.168.1.243    # 内部DNSに登録済のIPアドレス w1.labo.local
          nameservers:              
            addresses:
                - 192.168.1.9       # 内部DNSのアドレス
            search:                 # ドメイン名を省略可能なドメインをセット
                - labo.local
          netmasklen: 24            # ネットマスク
          routes:                   # デフォルトGW ルーターのアドレスを指定
            - to: default
              via: 192.168.1.1