apiVersion: v1
kind: Server
metadata:
    name: ansible-ws
    comment: "Ansible ワークステーション"
spec:
    cpu: 1
    memory: 2048
    mmImage: ubuntu24.04 
    auth:
        url: https://github.com/takara9.keys
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
    storage:
        - metadata:
            name: /var/ansible-ws
            comment: リポジトリの保存エリアとして利用
          spec:
            size: 10
            type: lvm
            kind: data
            #persistent: true           
