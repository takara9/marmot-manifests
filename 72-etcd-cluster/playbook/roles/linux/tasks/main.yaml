- name: Check OS is Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == linux_supported_distribution
      - ansible_distribution_version == linux_supported_version
    fail_msg: "This playbook supports {{ linux_supported_distribution }} {{ linux_supported_version }} only."

- name: Check data disk
  ansible.builtin.stat:
    path: "{{ linux_data_dev }}"
  register: data_dev

- name: Fail if data disk is missing
  ansible.builtin.assert:
    that: data_dev.stat.exists and data_dev.stat.isblk
    fail_msg: "{{ linux_data_dev }} is not found or not a block device."

# etcd パッケージのインストール前にデータ領域をマウントする
- name: Create ext4 filesystem (skip if already formatted)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ linux_data_dev }}"
    opts: "-L {{ linux_data_fs_label }}"
    force: false

- name: Get filesystem UUID
  ansible.builtin.command: blkid -s UUID -o value {{ linux_data_dev }}
  register: data_uuid
  changed_when: false

- name: Create mount point
  ansible.builtin.file:
    path: "{{ linux_data_mount_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount data disk and register in /etc/fstab
  ansible.posix.mount:
    path: "{{ linux_data_mount_dir }}"
    src: "UUID={{ data_uuid.stdout }}"
    fstype: ext4
    opts: defaults,noatime
    dump: "0"
    passno: "2"
    state: mounted
