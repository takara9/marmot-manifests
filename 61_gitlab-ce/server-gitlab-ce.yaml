apiVersion: v1
kind: Server
metadata:
    name: gitlab
    comment: "GitLab CE サーバー"
spec:
    cpu: 8
    memory: 16384
    mmImage: ubuntu24.04 
    bootVolume:
        spec:
            #size: 100   ## Debugログが出ているため、一時的にサイズを増やしています
            type: qcow2
    auth:
        url: https://github.com/takara9.keys
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
          address: 192.168.1.241     # IPアドレスを手動設定（IPアドレスの重複使用に注意)
          nameservers:              # DNSサーバー
            addresses:
                - 192.168.1.9       # 内部DNSのアドレス
            search:                 # ドメイン名を省略可能なドメインをセット
                - labo.local
          netmasklen: 24            # ネットマスク
          routes:                   # デフォルトGW ルーターのアドレスを指定
            - to: default
              via: 192.168.1.1
    storage:
        - metadata:
            name: /var/opt/gitlab
            comment: リポジトリの保存エリアとして利用
          spec:
            size: 40
            type: lvm
            kind: data
            persistent: true           