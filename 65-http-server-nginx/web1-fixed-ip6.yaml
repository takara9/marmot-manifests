apiVersion: v1
kind: Server
metadata:
    name: web1
    comment: NGINX Webサーバーを構築、IPアドレスは固定
    labels:
        app: webs
spec:
    cpu: 1
    memory: 1024
    mmImage: ubuntu24.04
    auth:
        url: https://github.com/takara9.keys
    ansible:
        playbook: playbook/install.yaml
        inventory: playbook/hosts.yaml
    networkInterface:
        - networkname: host-bridge
          address: 192.168.1.242
          netmasklen: 24
          nameservers:              
            addresses:
                - 192.168.1.9       # 内部DNSのアドレス
            search:                 # ドメイン名を省略可能なドメインをセット
                - labo.local
          routes:                   # デフォルトGW ルーターのアドレスを指定
            - to: default
              via: 192.168.1.1
        - networkname: host-bridge
          address: 2400:2411:bc83:3a00::242   # 例。SLAAC やルーターのアドレスと重複しない値にする
          netmasklen: 64
          routes:
            - to: default
              via: fe80::e73:29ff:feac:be58     # ルーターのリンクローカルアドレス
