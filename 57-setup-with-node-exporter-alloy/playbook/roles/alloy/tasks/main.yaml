- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: "{{ alloy_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Grafana apt signing key
  ansible.builtin.get_url:
    url: "{{ alloy_gpg_key_url }}"
    dest: "{{ alloy_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ alloy_keyring_path }}] {{ alloy_apt_repo_url }} {{ alloy_apt_repo_dist }} {{ alloy_apt_repo_component }}"
    filename: grafana
    state: present

- name: Install alloy package
  ansible.builtin.apt:
    name: "{{ alloy_package_name }}"
    state: present
    update_cache: yes

- name: Configure alloy to forward logs to Loki
  ansible.builtin.copy:
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0644"
    content: |
      loki.write "default" {
        endpoint {
          url = "{{ alloy_loki_write_endpoint }}"
        }
      }

      loki.source.journal "systemd" {
        forward_to = [loki.write.default.receiver]
        labels = {
          job = "systemd-journal",
          host = constants.hostname,
        }
      }

      prometheus.remote_write "metrics_service" {
          endpoint {
              url = "{{ alloy_prometheus_remote_write_endpoint }}"
          }
      }

      prometheus.exporter.unix "local_system" { }

      prometheus.scrape "scrape_metrics" {
        targets         = prometheus.exporter.unix.local_system.targets
        forward_to      = [prometheus.relabel.filter_metrics.receiver]
        scrape_interval = "10s"
      }

      prometheus.relabel "filter_metrics" {
        rule {
          action        = "drop"
          source_labels = ["env"]
          regex         = "dev"
        }

        forward_to = [prometheus.remote_write.metrics_service.receiver]
      }
  notify: Restart alloy service

- name: Enable and start alloy service
  ansible.builtin.service:
    name: "{{ alloy_service_name }}"
    enabled: true
    state: started

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

