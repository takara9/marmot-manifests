- name: Restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted

- name: Restart dovecot
  ansible.builtin.systemd:
    name: dovecot
    state: restarted

- name: Restart apache2
  ansible.builtin.systemd:
    name: apache2
    state: restarted
  when: mail_roundcube_enabled
