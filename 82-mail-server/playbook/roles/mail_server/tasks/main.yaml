- name: Validate mail settings
  ansible.builtin.assert:
    that:
      - mail_tls_mode in ['selfsigned', 'provided']
      - mail_tls_mode != 'provided' or (mail_tls_cert_src | length > 0 and mail_tls_key_src | length > 0)
      - mail_hostname.endswith('.' ~ mail_domain)
      - mail_users | length > 0
      - mail_users | map(attribute='name') | select('match', '^[a-z0-9][a-z0-9._-]*$') | list | length == mail_users | length
      - mail_users | selectattr('password', 'undefined') | selectattr('password_hash', 'undefined') | list | length == 0
      - mail_aliases.values() | select('in', mail_users | map(attribute='name') | list) | list | length == mail_aliases | length
    fail_msg: >-
      mail_tls_mode は selfsigned / provided のいずれか(provided では mail_tls_cert_src と mail_tls_key_src が必須)。
      mail_hostname は mail_domain 配下の名前、mail_users の name は小文字英数字と . _ - のみ、
      各ユーザーに password または password_hash が必要、mail_aliases の宛先は mail_users に存在すること。

- name: Validate outbound mail domain
  ansible.builtin.assert:
    that:
      - mail_outbound_domain is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - mail_outbound_domain | length <= 253
      - not mail_outbound_domain.endswith('.local')
      - mail_outbound_domain != mail_domain
      - mail_outbound_domain != mail_hostname
    fail_msg: "mail_outbound_domain は内部ドメインとは別の公開 FQDN を小文字で指定してください (.local は使用不可)。"
  when: mail_outbound_domain | length > 0

- name: Validate SMTP relay settings
  ansible.builtin.assert:
    that:
      - not mail_relay_enabled or mail_relay_host is match('^[A-Za-z0-9.-]+$')
      - not mail_relay_enabled or (mail_relay_port | int > 0 and mail_relay_port | int < 65536)
      - not mail_relay_enabled or mail_relay_username | length > 0
      - not mail_relay_enabled or mail_relay_password | length > 0
    fail_msg: >-
      SMTP リレーを有効にする場合は mail_relay_host / mail_relay_port /
      mail_relay_username と、Ansible Vault 等で渡す mail_relay_password が必要です。

# Postfix の設定は後で上書きするため、パッケージ導入時の質問は既定のまま回答する
- name: Preseed postfix (non-interactive)
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.q }}"
    value: "{{ item.v }}"
    vtype: "{{ item.t }}"
  loop:
    - { q: "postfix/main_mailer_type", v: "Internet Site", t: "select" }
    - { q: "postfix/mailname", v: "{{ mail_domain }}", t: "string" }

- name: Install mail packages
  ansible.builtin.apt:
    name: "{{ mail_packages + mail_tools }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set mailname
  ansible.builtin.copy:
    dest: /etc/mailname
    content: "{{ mail_domain }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart postfix

# ---------- メールボックス用ユーザー ----------
- name: Create vmail group
  ansible.builtin.group:
    name: "{{ mail_vmail_user }}"
    gid: "{{ mail_vmail_uid }}"
    system: true

- name: Create vmail user
  ansible.builtin.user:
    name: "{{ mail_vmail_user }}"
    uid: "{{ mail_vmail_uid }}"
    group: "{{ mail_vmail_user }}"
    system: true
    home: "{{ mail_vmail_home }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create mailbox directory
  ansible.builtin.file:
    path: "{{ mail_vmail_home }}"
    state: directory
    owner: "{{ mail_vmail_user }}"
    group: "{{ mail_vmail_user }}"
    mode: "0770"

# ---------- TLS ----------
- name: Create TLS directory
  ansible.builtin.file:
    path: "{{ mail_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create a private CA and issue the server certificate
  ansible.builtin.import_tasks: tls_selfsigned.yaml
  when: mail_tls_mode == 'selfsigned'

- name: Install the provided server certificate
  ansible.builtin.import_tasks: tls_provided.yaml
  when: mail_tls_mode == 'provided'

# ---------- Dovecot (IMAP / LMTP / 認証) ----------
- name: Deploy dovecot user database
  ansible.builtin.template:
    src: dovecot-users.j2
    dest: /etc/dovecot/users
    owner: root
    group: dovecot
    mode: "0640"
  no_log: true

- name: Deploy dovecot.conf
  ansible.builtin.template:
    src: dovecot.conf.j2
    dest: /etc/dovecot/dovecot.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/doveconf -c %s -n
  notify: Restart dovecot

# ---------- Postfix (SMTP) ----------
- name: Deploy outbound SMTP address map
  ansible.builtin.template:
    src: smtp-generic.j2
    dest: /etc/postfix/smtp-generic
    owner: root
    group: root
    mode: "0644"
  notify: Restart postfix
  when: mail_outbound_domain | length > 0

- name: Deploy outbound SMTP relay credentials
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart postfix
  when: mail_relay_enabled

- name: Compile outbound SMTP relay credentials
  ansible.builtin.command: postmap hash:/etc/postfix/sasl_passwd
  changed_when: false
  when: mail_relay_enabled

- name: Restrict compiled SMTP relay credentials
  ansible.builtin.file:
    path: /etc/postfix/sasl_passwd.db
    owner: root
    group: root
    mode: "0600"
  when: mail_relay_enabled

- name: Deploy postfix main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Restart postfix

- name: Deploy virtual mailbox map
  ansible.builtin.template:
    src: vmailbox.j2
    dest: /etc/postfix/vmailbox
    owner: root
    group: root
    mode: "0644"
  notify: Restart postfix

- name: Deploy virtual alias map
  ansible.builtin.template:
    src: virtual.j2
    dest: /etc/postfix/virtual
    owner: root
    group: root
    mode: "0644"
  notify: Restart postfix

- name: Add submission and smtps services to master.cf
  ansible.builtin.blockinfile:
    path: /etc/postfix/master.cf
    marker: "# {mark} ANSIBLE MANAGED MAIL SUBMISSION"
    block: "{{ lookup('ansible.builtin.template', 'master-submission.cf.j2') }}"
  notify: Restart postfix

- name: Check postfix configuration
  ansible.builtin.command: postfix check
  changed_when: false

- name: Configure Roundcube webmail
  ansible.builtin.import_tasks: roundcube.yaml
  when: mail_roundcube_enabled

# ---------- ファイアウォール ----------
- name: Allow mail ports on UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ['25', mail_submission_port, mail_imap_port, mail_imaps_port] + (['465'] if mail_enable_smtps else []) + (['80', '443'] if mail_roundcube_enabled else []) }}"
  when: mail_configure_ufw

- name: Apply pending handlers before starting services
  ansible.builtin.meta: flush_handlers

- name: Enable and start mail services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - dovecot
    - postfix

- name: Enable and start Roundcube web server
  ansible.builtin.systemd:
    name: apache2
    enabled: true
    state: started
  when: mail_roundcube_enabled

# ---------- 動作確認 ----------
- name: Wait for mail ports
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 60
  loop: "{{ [25, mail_submission_port, mail_imap_port, mail_imaps_port] + ([465] if mail_enable_smtps else []) }}"

- name: Verify Roundcube HTTPS login page
  ansible.builtin.uri:
    url: "https://{{ mail_hostname }}/"
    ca_path: "{{ mail_tls_dir ~ '/ca.crt' if (mail_tls_mode == 'selfsigned' or mail_tls_ca_src | length > 0) else omit }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: mail_roundcube_check
  failed_when: >-
    mail_roundcube_check.status != 200 or
    'name="_user"' not in (mail_roundcube_check.content | default(''))
  when: mail_roundcube_enabled

- name: Query MX records of the mail domain
  ansible.builtin.command: "dig +short MX {{ mail_domain }}"
  register: mail_mx
  changed_when: false
  when: mail_check_mx

- name: Check that the MX record points to this mail server
  ansible.builtin.assert:
    that:
      - mail_mx.stdout_lines | select('search', '(?i)\s' ~ (mail_hostname | regex_escape) ~ '\.?$') | list | length > 0
    fail_msg: >-
      DNS の {{ mail_domain }} の MX レコードが {{ mail_hostname }} を指していません (dig の結果: {{ mail_mx.stdout_lines }})。
      DNS に MX レコードと {{ mail_hostname }} の A レコードを登録してください。
    success_msg: "MX {{ mail_domain }} -> {{ mail_hostname }}"
  when: mail_check_mx
