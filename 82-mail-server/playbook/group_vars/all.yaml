# メールドメイン。MX レコードがこのドメインのメールサーバーを指していること
mail_domain: labo.local

# メールサーバーの FQDN。DNS の A レコードと MX レコードの宛先に一致させる
mail_hostname: mail.labo.local

# 外向き SMTP 配送時だけアドレスと EHLO 名を公開ドメインにする
# 内部メールボックスとログイン名は labo.local のまま維持する
mail_outbound_domain: marmot.mydns.jp

# メールボックスを持つユーザー。アドレスは <name>@<mail_domain>
# password はラボ用の仮値。ansible-vault 等で上書きすること
# 作成済みのハッシュを使う場合は password の代わりに password_hash を指定する
#   例: password_hash: "{SHA512-CRYPT}$6$..."   (doveadm pw -s SHA512-CRYPT で生成)
mail_users:
  - { name: admin, password: admin-change-me }
  - { name: user1, password: user1-change-me }

# 別名。<alias>@<mail_domain> 宛のメールを、右辺のユーザーのメールボックスへ配送する
mail_aliases:
  postmaster: admin
  root: admin
  abuse: admin
  hostmaster: admin

# mail_domain の別名ドメイン。<user>@<別名ドメイン> 宛を <user>@<mail_domain> へ配送する
# 公開ドメイン宛を既存の内部メールボックスへ配送する
mail_alias_domains:
  - marmot.mydns.jp
