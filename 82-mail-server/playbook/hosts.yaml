all:
  vars:
    ansible_connection: ssh
    ansible_ssh_executable: /usr/local/bin/mactl-ssh
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
  children:
    # メールサーバー (Postfix + Dovecot)
    mail_servers:
      hosts:
        mail:
    # メールを送信する側のサーバー (任意)。labo.local のサーバーを追加すると、
    # cron などのメールが MX レコードを参照してメールサーバーへ届く
    mail_clients:
      hosts: {}
      #  web01:
      #  app01:
