# HashiCorp の公式リポジトリから vault CLI をインストールする (Debian系 / RHEL系 両対応)

# ---- Debian / Ubuntu 系 ----
- name: Install prerequisite packages (Debian)
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
      - jq
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Download HashiCorp apt signing key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /tmp/hashicorp.gpg
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Dearmor HashiCorp apt signing key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg /tmp/hashicorp.gpg
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg
  when: ansible_os_family == "Debian"

- name: Add HashiCorp apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    filename: hashicorp
    state: present
  when: ansible_os_family == "Debian"

- name: Install vault package (apt)
  ansible.builtin.apt:
    name: vault
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

# ---- AlmaLinux / RHEL 系 ----
- name: Install prerequisite packages (RedHat)
  ansible.builtin.dnf:
    name:
      - curl
      - jq
    state: present
  when: ansible_os_family == "RedHat"

- name: Add HashiCorp yum repository
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo
    mode: "0644"
  when: ansible_os_family == "RedHat"

- name: Install vault package (dnf)
  ansible.builtin.dnf:
    name: vault
    state: present
    update_cache: yes
  when: ansible_os_family == "RedHat"

# VAULTサーバーの接続先を環境変数にセットし、自己署名TLS証明書の検証をスキップする
- name: Set Vault CLI environment variables for all users
  ansible.builtin.copy:
    dest: /etc/profile.d/vault-env.sh
    content: |
      export VAULT_ADDR="https://vault.labo.local:8200"
      export VAULT_SKIP_VERIFY=true
    owner: root
    group: root
    mode: "0644"
