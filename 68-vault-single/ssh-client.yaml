apiVersion: v1
kind: Server
metadata:
    name: ssh-client
    comment: sshクライアント用の仮想サーバー
    labels:
        unit: 22
        role: debian
spec:
    cpu: 1
    memory: 1024
    mmImage: debian13
    auth:
        #publicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP6CPvNHHeF8rHScC7vrq7HMqTPQJcl08atMSqHk/gSy For marmot VMs"
        url: https://github.com/takara9.keys
        users:
         - debian
    ansible:
        playbook: playbook/install-ssh-client.yaml
        inventory: playbook/hosts-ssh-client.yaml
    networkInterface:
        - networkname: host-bridge